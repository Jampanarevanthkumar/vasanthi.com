<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JampanaRevanthKumar</title>
</head>
<body>

     <h3>perss this button to get suprise</h3>  
      
    <p id="demo"></p>
    <p id="msg"></p>

    <button onclick="show()">Click</button>

    <button onclick="del();hi()">Delete</button>
    <p id="no"></p>

    <script>

            function show(){
                let demo = document.getElementById("demo");
                
                demo.innerHTML += "<h5>"+"hello"+"</h5>";
            }

            function del(){
                let demo = document.getElementById("demo");

                if(demo.firstElementChild != null){
                    demo.firstElementChild.remove();
                }
                else{
                    alert("no content available");
                }
            }

            function hi(){
                let a = document.getElementById("msg");
                a.textContent ="deleted sucessfully";
                a.style.color = "red";
            }

    </script>

    
</body>
</html>
