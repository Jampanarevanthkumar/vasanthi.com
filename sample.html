<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi Mannem Vasanthi</title>
</head>
<body>

     <h3>perss this button to get suprise</h3>  
      
    <p id="demo"></p>

    <button onclick="show()">Click</button>

    <button onclick="del">Delete</button>
    <p id="no"></p>

    <script>

            function show(){
                let demo = document.getElementById("demo");
                
                demo.innerHTML += "<h5>"+"i love you vasanthi"+"</h5>";
            }

            function del(){
                let demo = document.getElementById("demo");

                if(demo.firstElementChild != null){
                    demo.firstElementChild.remove();
                }
                else{
                        document.getElementById("no").textContent="no content available";
                }
            }

    </script>

    
</body>
</html>
