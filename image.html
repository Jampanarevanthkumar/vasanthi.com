<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mannem Vasanthi</title>
    <style>
        #img{
            border: 3px solid rgb(84, 16, 185);
            box-shadow: 8px  10px 10px rgb(202, 185, 185);
            transition: 3s;
        }
        #parent{
            height:680px;
            width:300px;
            background-color:rgb(158, 214, 178);
            padding-left:20px;
            padding-top:20px;
            padding-right: 20px;
             border-radius: 5px;
        }
         #name{
            background:radial-gradient(red,blue,rgb(239, 13, 182),rgb(223, 139, 139),rgb(6, 6, 159),red);
            color:transparent;
            background-clip: text;
            font-size: 28px;
        }#button{
            border:2px solid black;
            height:30px;
            width:100px;
            border-radius: 7px;
        }
        
        #img:hover{
            transform: rotate(365deg);
        }
    </style>
</head>
<body>

    <div id="parent">
    <center><h1 id="name">Mannem Vasanthi</h2></center>

    <center><img id="img" src="images/vasu.jpeg" width="270" height="350"></center>
     <center>
    
       <h4>Chinnoda</h4>
       <br>
        
       <button id="button" onclick="change()">change image</button>
    </div>
    

    <script>

        function change(){
            document.getElementById("img").src="images/vasu1.jpeg";
            
        }

    </script>
</body>
</html>
