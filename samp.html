<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=login" />

    <style>

       

        .para1 {
            font-size: 40px;
            color: rgb(11, 169, 237);
            font-weight: bold;
            text-align: center;
            margin-top: 100px;
        }
    </style>
</head>
<body>
  
     <p class="para"></p>
    
    <button onclick="change()">style change</button>
     <button  onclick="hide()">hide</button>

     <script>
        
function time(){

        let date = new Date(); 
        
        let seconds = date.getSeconds();

        let minutes = date.getMinutes();

        let hours = date.getHours();

        // let mimmisec = date.getMilliseconds();
           
        let time = hours+" : "+minutes+" : "+seconds;

        document.getElementsByClassName("para")[0].innerHTML=time;
       

}

        setInterval(time,1);

        time();

       function change(){

        let a = document.getElementsByClassName("para");

        a[0].classList.add("para1");
       }
        
     </script>
</body>
</html>
