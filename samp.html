<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
      #search{
         height:25px;
         width:400px;
         border: 2px solid black;
         border-radius: 5px;
      }

      .child{
         height:"25px";
         width:"200px";
         border:"2px solid black";
      }
   </style>
       
</head>
<body>
        
      <input type="text" id="search" placeholder="type..." minlength="5" maxlength="100"></input>
   <p id="para"></p>
      <div id="parent">

      </div>

      <br><br><button id="button" onclick="show()">Add</button>

      <br><br><button id="button" onclick="del()">Delete</button>


       <script>   

            let main = document.getElementById("search");
            

            let button = document.getElementById("button");

            let add = document.getElementById("parent");

            function show(){

               if(main.value.trim() !== ""){
               let child = document.createElement("p");
                  if(main.value.length <= 100 && main.value.length >=5){   
                     child.innerHTML = main.value.trim();
                     child.classList.add(".wqdqwfqwfechild");
                  }
                  else{
                     document.getElementById("para").textContent = "min 5 and max 100  characters";
                  }
               add.appendChild(child);
               let input = document.createElement("input");
               input.type.radio; 

               add.appendChild(input);

               }
               setTimeout(function(){
                  document.getElementById("para").textContent = "";
               },5000);
            }

            function del(){
                 if(document.getElementById("parent").lastElementChild){
                  document.getElementById("parent").removeChild(document.getElementById("parent").lastElementChild)
                 }
            }

       </script>

</body>
</html>
